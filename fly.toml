# fly launch --no-deploy --copy-config, then:
#   fly volumes create tutor_data --size 1
#   fly secrets set OPENROUTER_API_KEY=... APP_PASSCODE=...
#   fly deploy
app = "quadratics-tutor"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/tutor.db"
  ALLOW_FAULT_INJECTION = "true"
  DAILY_SPEND_CAP_USD = "5"

[mounts]
  source = "tutor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so reviewers never wait for a cold start.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
