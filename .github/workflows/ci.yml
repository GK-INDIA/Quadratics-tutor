name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly: the same prompts against whatever the provider is serving today.
    - cron: '30 20 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # No key needed: checks that the fallback paths still hold a lesson together.
      - run: pnpm eval --offline
      - run: pnpm simulate --offline
        env:
          DB_PATH: ./data/ci-sim.db
      - run: pnpm build

  eval:
    # Costs money, so it runs when the tutor's behaviour could have changed, and nightly.
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[eval]') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip unless prompts, curriculum, policy or models changed
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet origin/${{ github.base_ref }}... -- prompts curriculum packages/shared apps/api/src/tutor .env.example; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.skip != 'true'
        run: pnpm eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: steps.changed.outputs.skip != 'true'
        run: pnpm eval:mutation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results
          if-no-files-found: ignore
