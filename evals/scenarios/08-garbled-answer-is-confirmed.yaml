id: garbled-answer-is-confirmed
catches: >-
  An unsettled spoken answer (several candidates, no commitment) being graded as a failed attempt.
  Marking noise wrong teaches a student that guessing out loud is penalised, and wastes a re-teach.
concept: factorisation
turns:
  - student: Um, the roots are two and, uh, five, or maybe seven, I can't remember which one it was
    expect:
      action: [confirm, reprompt]
      progress_unchanged: true
      degraded: []
  - student: Sorry. The roots are two and five, because minus two and minus five multiply to ten and add to minus seven.
    expect:
      grade: correct
      action: next_check
